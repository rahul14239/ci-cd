name: Java ci with maven

on:
  push:
    branches: ["main"]
 
jobs:
  build-and-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fix for warnings: Upgraded setup-java to v5
      - name: setup java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      # Fix for Error 126: Grants execute permission to the wrapper script
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # This will now succeed without exit code 126
      - name: build with maven
        run: ./mvnw clean package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app-jar
          path: target/*.jar

    
