name: Java ci with maven

on:
  push:
    branches: ["main"]
 
jobs:
  build-and-artifact:
    runs-on: ubuntu-latest

  steps:
  
   - name: Checkout
    uses: actions/checkout@v5.1.0

   - name: setup java
     uses: actions/setup-java@v6.0.1
     with:
       java-version: '25'
       distribution: 'oracle'
       cache: 'maven'

    - name: build with maven
      run: ./mvnw clean package

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app-jar
        path: target/*.jar
    
